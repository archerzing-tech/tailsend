name: Release

# Tag a commit (git tag v0.2.1 && git push origin v0.2.1) to cut a release:
# desktop installers (macOS universal / Windows / Linux) plus an Android APK,
# all attached to a draft GitHub release for review before publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # pinned: universal build, Apple Silicon + Intel
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri system dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Tailsend ${{ github.ref_name }}
          releaseBody: "下载对应平台的安装包。Android APK 见下方 assets（armv8 / armv7，release 签名）。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    # Independent of the desktop builds: a desktop flake must not keep the
    # APKs out of the release, and building in parallel halves wall time.
    runs-on: ubuntu-24.04 # pinned so NDK/SDK don't shift under us on image migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx tauri android init
      - name: Apply app icon (gen/ is not in the repo, init writes Tauri defaults)
        working-directory: app
        run: |
          npx tauri icon src-tauri/icons/app-icon.png
          test -f src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Apply receiver foreground service (gen/ is not in the repo)
        working-directory: app
        run: ./src-tauri/android/apply-fgs.sh
      - name: Pin minSdkVersion (Android 10+ must stay supported)
        run: sed -i 's/minSdk = [0-9][0-9]*/minSdk = 24/' app/src-tauri/gen/android/app/build.gradle.kts
      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tailsend.keystore"
      - name: Configure release signing
        run: |
          G=app/src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/^    buildTypes {/    signingConfigs {\n        create("release") {\n            val store = System.getenv("TAURI_SIGNING_KEYSTORE_FILE")\n            if (store != null) {\n                storeFile = file(store)\n                storePassword = System.getenv("TAURI_SIGNING_KEYSTORE_PASSWORD")\n                keyAlias = System.getenv("TAURI_SIGNING_KEY_ALIAS")\n                keyPassword = System.getenv("TAURI_SIGNING_KEY_PASSWORD")\n            }\n        }\n    }\n\n    buildTypes {/' $G
          sed -i 's/^        getByName("release") {/        getByName("release") {\n            if (System.getenv("TAURI_SIGNING_KEYSTORE_FILE") != null) {\n                signingConfig = signingConfigs.getByName("release")\n            }/' $G
          grep -q signingConfigs $G && echo "signing config injected"
      - name: Build armv8 (arm64-v8a) APK
        working-directory: app
        env:
          TAURI_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/tailsend.keystore
          TAURI_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          npx tauri android build --target aarch64 --apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "found: $apk"
          cp "$apk" "$GITHUB_WORKSPACE/Tailsend-${{ github.ref_name }}-android-armv8.apk"
      - name: Build armv7 (armeabi-v7a) APK
        working-directory: app
        env:
          TAURI_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/tailsend.keystore
          TAURI_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          npx tauri android build --target armv7 --apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "found: $apk"
          cp "$apk" "$GITHUB_WORKSPACE/Tailsend-${{ github.ref_name }}-android-armv7.apk"
      - name: Verify signatures and ABIs
        env:
          V8: Tailsend-${{ github.ref_name }}-android-armv8.apk
          V7: Tailsend-${{ github.ref_name }}-android-armv7.apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort | tail -1)
          $APKSIGNER verify "$V8" && $APKSIGNER verify "$V7" && echo "signatures OK"
          unzip -l "$V8" | grep -q "lib/arm64-v8a/" && ! unzip -l "$V8" | grep -q "lib/armeabi-v7a/" && echo "armv8 APK: arm64-v8a only"
          unzip -l "$V7" | grep -q "lib/armeabi-v7a/" && ! unzip -l "$V7" | grep -q "lib/arm64-v8a/" && echo "armv7 APK: armeabi-v7a only"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Tailsend-*-android-armv8.apk
            Tailsend-*-android-armv7.apk
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Tailsend-${{ github.ref_name }}-android-armv8.apk" "Tailsend-${{ github.ref_name }}-android-armv7.apk" --clobber
