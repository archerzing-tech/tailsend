name: Release

# Tag a commit (git tag v0.2.1 && git push origin v0.2.1) to cut a release:
# desktop installers (macOS universal / Windows / Linux) plus an Android APK,
# all attached to a draft GitHub release for review before publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # universal: Apple Silicon + Intel
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri system dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Tailsend ${{ github.ref_name }}
          releaseBody: "下载对应平台的安装包。Android APK 见下方 assets（arm64，debug 签名）。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx tauri android init
      - name: Pin minSdkVersion (Android 10+ must stay supported)
        run: sed -i 's/minSdk = [0-9][0-9]*/minSdk = 24/' app/src-tauri/gen/android/app/build.gradle.kts
      - name: Build arm64 APK
        working-directory: app
        run: npx tauri android build --target aarch64 --apk --debug
      - name: Stage APK
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "found: $apk"
          cp "$apk" "Tailsend-${{ github.ref_name }}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Tailsend-*.apk
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Tailsend-${{ github.ref_name }}-android-arm64.apk" --clobber
