[package]
name = "tailsend"
version = "0.2.2"
description = "Send files between your machines over Tailscale"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tailsend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"
axum = { version = "0.8", features = ["multipart", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
percent-encoding = "2"
walkdir = "2"
dirs = "5"
hostname = "0.4"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Embedded tsnet node (mobile): Rust commands ↔ Kotlin ↔ gomobile AAR.
tauri-plugin-tsnet = { path = "plugins/tsnet" }

# Native file dialogs — desktop only; mobile uses the webview file picker.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "0.15"

# Finder-style file icons for the send queue (NSWorkspace → PNG → base64).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSString",
] }
