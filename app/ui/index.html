<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Tailsend</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body data-platform="desktop" data-tab="send">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="330" y1="320" x2="780" y2="720">
            <stop offset="0" stop-color="#4ed0ff" />
            <stop offset="1" stop-color="#2e5bf0" />
          </linearGradient>
        </defs>
        <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff" />
        <g transform="translate(-64, 35)">
          <path d="M 445 505 L 302 632 L 462 672 Z" fill="#2450c8" />
          <path d="M 748 455 C 735 372 668 315 590 318 C 505 322 448 385 438 470 C 434 508 428 546 412 580 C 405 595 396 609 388 620 C 410 656 472 690 548 690 C 650 688 722 620 748 535 C 756 508 752 480 748 455 Z" fill="url(#lg)" />
          <path d="M 470 522 C 496 450 586 438 639 488 C 601 568 521 598 471 568 C 459 550 461 536 470 522 Z" fill="#1c3fae" opacity=".92" />
          <path d="M 745 398 L 838 442 L 745 488 Z" fill="#ffb13d" stroke="#ffb13d" stroke-width="26" stroke-linejoin="round" />
          <circle cx="652" cy="392" r="40" fill="#ffffff" />
          <circle cx="663" cy="397" r="19" fill="#101a2c" />
          <path d="M 562 318 Q 576 274 620 264 Q 600 298 596 330 Q 576 327 562 318 Z" fill="#2450c8" />
        </g>
      </svg>
      <span class="name">Tailsend</span>
      <span class="ver" id="ver"></span>
    </div>
    <div class="statusbar">
      <span class="seg" id="chip-self">本机：读取中…</span>
      <span class="seg" id="chip-recv"><i class="dot"></i>接收端检测中…</span>
      <span class="seg" id="chip-dir" hidden></span>
    </div>
  </header>

  <!-- 桌面侧栏：发送 / 接收 / 本机 -->
  <nav class="sidebar" aria-label="页面">
    <button data-action="tab" data-tab="send" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3.6 9.8c-.9.35-.86 1.63.06 1.93l6.44 2.1 2.2 6.3c.3.9 1.6.9 1.9 0L21 3Z"/><path d="m10.1 13.8 4-4"/></svg>
      <span>发送</span>
    </button>
    <button data-action="tab" data-tab="recv" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10m0 0 4-4m-4 4-4-4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span>接收</span>
      <i class="badge" data-mount="badge-inbox" hidden></i>
    </button>
    <button data-action="tab" data-tab="self" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10.5" rx="2"/><path d="M2.5 18.5h19"/></svg>
      <span>本机</span>
    </button>
  </nav>

  <main>
    <div class="banner" id="banner" hidden></div>

    <!-- ====================================================== 发送 -->
    <section class="view" id="view-send">
      <div class="guard" data-mount="send-guard" hidden></div>

      <section class="drop" data-mount="drop">
        <svg class="drop-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15V4m0 0l-4 4m4-4l4 4" />
          <path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
        </svg>
        <div class="drop-copy">
          <p class="drop-title">拖入文件或文件夹</p>
          <p class="drop-hint">超过 1GB 的文件请用「选择文件」走原生通道</p>
        </div>
        <div class="drop-btns">
          <button class="primary" data-action="pick">选择文件</button>
          <button class="ghost" data-action="pickdir">文件夹</button>
          <button class="ghost" data-action="inputfile">界面选择</button>
        </div>
        <input type="file" class="file-in" multiple hidden />
        <input type="file" class="dir-in" webkitdirectory multiple hidden />
      </section>

      <section class="panel queue-panel" hidden>
        <div class="panel-head">
          <h2>待发送 <span class="count" data-mount="queue-count"></span></h2>
        </div>
        <ul class="queue" data-mount="queue"></ul>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>设备 <span class="count" data-mount="peers-count"></span></h2>
          <div class="panel-tools">
            <label class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
              <input data-action="peer-search" type="text" placeholder="搜索名称或 IP" spellcheck="false" />
            </label>
            <button class="ghost icon" data-action="peers-refresh" title="重新扫描" aria-label="重新扫描">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
            </button>
          </div>
        </div>
        <div class="devs" data-mount="peers">
          <div class="empty">正在读取设备…</div>
        </div>
        <div class="manual">
          <input class="manual-in" data-action="manual-input" type="text" spellcheck="false"
                 placeholder="添加对方的 IP / 主机名 / IP:端口" />
          <button class="ghost" data-action="manual-use">添加</button>
        </div>
      </section>

      <div class="sendbar">
        <div class="overall">
          <div class="obar"><i data-mount="ofill"></i></div>
          <span class="otext" data-mount="otext"></span>
        </div>
        <span class="sendline" data-mount="sendline">选择文件，再点下面的设备</span>
        <button class="primary send" data-action="send" disabled>发送</button>
      </div>
    </section>

    <!-- ====================================================== 接收 -->
    <section class="view" id="view-recv">
      <section class="hero">
        <div class="radar" aria-hidden="true">
          <i></i><i></i><i></i>
          <svg class="radar-mark" viewBox="0 0 24 24"><path d="M12 3v10m0 0 4-4m-4 4-4-4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        </div>
        <div class="hero-copy">
          <p class="h-state" data-mount="recv-meta">检测中…</p>
          <p class="h-dir" data-mount="recv-hint" hidden></p>
        </div>
        <div class="hero-actions">
          <button class="ghost" data-action="open-inbox">打开文件夹</button>
          <button class="switch" data-action="recv-master" aria-pressed="false" aria-label="开启或关闭接收"></button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>收到的文件 <span class="count" data-mount="inbox-count"></span></h2>
        </div>
        <ul class="inbox" data-mount="inbox"></ul>
      </section>
    </section>

    <!-- ====================================================== 本机 -->
    <section class="view" id="view-self">
      <section class="panel">
        <div class="me">
          <span class="ava me-ava" aria-hidden="true">
            <svg viewBox="0 0 1024 1024"><use href="#bird"/></svg>
          </span>
          <div class="me-meta">
            <b class="me-name" data-mount="self-name">本机</b>
            <p class="me-sub"><span data-mount="self-ver"></span></p>
          </div>
        </div>
        <p class="selfip" data-mount="selfip" hidden></p>
      </section>

      <section class="panel" data-mount="node-card" hidden>
        <div class="panel-head">
          <h2>内置节点</h2>
          <span class="target" data-mount="node-state"></span>
        </div>
        <div class="node-body" data-mount="node-body"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>接收设置</h2></div>
        <div class="set-row">
          <span class="set-label">接收前先确认<b class="set-sub">关闭后收到的传输直接保存，不再询问</b></span>
          <button class="switch" data-action="confirm" aria-pressed="true" aria-label="接收前确认"></button>
        </div>
        <div class="set-row">
          <span class="set-label">接收令牌<b class="set-sub">发送方需填写相同的令牌才能发送</b></span>
          <button class="ghost" data-action="token" aria-expanded="false">设置</button>
        </div>
        <div class="token-row" data-mount="token-row" hidden>
          <input class="rx-token" type="password" spellcheck="false" autocomplete="off"
                 placeholder="接收令牌（留空 = 不校验）" />
          <button class="ghost" data-action="token-save">保存</button>
        </div>
        <button class="ghost wide" data-action="open-inbox">打开收件文件夹</button>
      </section>
    </section>
  </main>

  <!-- 移动 Tab 栏 -->
  <nav class="tabbar" aria-label="页面">
    <button data-action="tab" data-tab="send" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3.6 9.8c-.9.35-.86 1.63.06 1.93l6.44 2.1 2.2 6.3c.3.9 1.6.9 1.9 0L21 3Z"/><path d="m10.1 13.8 4-4"/></svg>
      <span>发送</span>
    </button>
    <button data-action="tab" data-tab="recv" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10m0 0 4-4m-4 4-4-4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span>接收</span>
      <i class="badge" data-mount="badge-inbox" hidden></i>
    </button>
    <button data-action="tab" data-tab="self" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10.5" rx="2"/><path d="M2.5 18.5h19"/></svg>
      <span>本机</span>
      <i class="ndot" data-mount="badge-node" aria-hidden="true"></i>
    </button>
  </nav>

  <!-- 收到传输请求：会话式确认 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="bird">
        <rect x="100" y="100" width="824" height="824" rx="185" fill="#fff" />
        <g transform="translate(-64, 35)">
          <path d="M 445 505 L 302 632 L 462 672 Z" fill="#2450c8" />
          <path d="M 748 455 C 735 372 668 315 590 318 C 505 322 448 385 438 470 C 434 508 428 546 412 580 C 405 595 396 609 388 620 C 410 656 472 690 548 690 C 650 688 722 620 748 535 C 756 508 752 480 748 455 Z" fill="#2e5bf0" />
          <path d="M 745 398 L 838 442 L 745 488 Z" fill="#ffb13d" stroke="#ffb13d" stroke-width="26" stroke-linejoin="round" />
          <circle cx="652" cy="392" r="40" fill="#ffffff" />
          <circle cx="663" cy="397" r="19" fill="#101a2c" />
        </g>
      </g>
    </defs>
  </svg>
  <div class="req-backdrop" id="req-backdrop" hidden>
    <div class="req-card" role="dialog" aria-modal="true" aria-labelledby="req-title">
      <div class="req-ring" id="req-ring"><span class="req-letter" id="req-letter"></span></div>
      <h3 id="req-title">收到传输请求</h3>
      <p class="req-sub" id="req-sub"></p>
      <ul class="req-files" id="req-files"></ul>
      <div class="req-btns">
        <button class="ghost" id="req-deny">拒绝</button>
        <button class="primary" id="req-accept">接收</button>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
